<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dsviz: interactive diagrams for teaching</title>
    <meta name="description" content="A TypeScript library for interactive, animated SVG diagrams: data structures, plots, probability, geometry, scheduling and memory." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Code+Pro:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='7' fill='%235b9dff'/%3E%3Cpath d='M9 21 L15 13 L19 17 L24 10' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      try { const t = localStorage.getItem('dsviz-theme'); if (t) document.documentElement.dataset.theme = t; document.documentElement.dataset.dvLook = localStorage.getItem('dsviz-look') || 'tactile'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
