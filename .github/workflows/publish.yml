name: Publish to npm

# Publishing a GitHub release publishes every package in packages/ (npm
# workspaces). They share one version. The release's tag must be that version
# (packages/core/package.json) with a v in front (v3.0.0 for 3.0.0), so the
# version on npm and the tag in git always name the same commit.
#
# It authenticates with npm Trusted Publishing: npm is told (on the package's
# settings page) to trust this workflow in this repository, and GitHub hands
# each run a short-lived OIDC token that npm exchanges for permission to
# publish. Each @figurae/* package needs its own trusted-publisher entry.
# There is no npm token stored anywhere to leak. npm can only trust
# a publisher for a package that exists, so the very first version of each
# package is published by hand.
#
# Auth is OIDC only: setup-node gets no registry-url, so there is no .npmrc
# and no token to fall back to. If the trusted login fails, the publish fails
# with npm's own reason instead of a misleading 404. For it to succeed, the
# packages' npm settings pages must list a trusted publisher for this
# repository and this workflow file (publish.yml).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # the OIDC token npm trusts

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No registry-url: it makes setup-node write an .npmrc with a placeholder
      # token, and when the trusted login is refused npm falls back to that
      # token and reports a bare "404 Not Found", hiding the real reason. No
      # dependency cache either: npm advises against caching in release builds.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: The tag names the version being published
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match packages/core/package.json version $version (expected v$version)"
            exit 1
          fi
      - run: npm ci
      # Trusted Publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11
      # Typecheck, test and build before anything is uploaded (the packages ship
      # their dist/).
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # --loglevel verbose prints npm's "oidc" lines, which say why npm turned
      # the trusted login down if it ever does.
      - run: npm publish --workspaces --access public --loglevel verbose
