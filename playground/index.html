<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dsviz playground</title>
    <style>
      :root { color-scheme: dark; }
      :root[data-theme="light"] { color-scheme: light; --bg: #ffffff; --panel: #fafafa; --text: #1a1d24; --border: #e2e4e9; }
      body { margin: 0; background: var(--bg, #121316); color: var(--text, #e8eaee); font: 14px/1.6 ui-sans-serif, system-ui, sans-serif; }
      main { max-width: 600px; margin: 0 auto; padding: 32px 20px 80px; }
      h2 { font-size: 16px; margin: 32px 0 12px; }
      .card { background: var(--panel, #181a1f); border: 1px solid var(--border, #26292f); border-radius: 12px; padding: 18px; display: grid; gap: 14px; }
      .status { font-size: 13px; margin: 0; }
      .note { font-size: 12px; color: #7a8190; margin: 0; }
      button.toggle { position: fixed; top: 12px; right: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
